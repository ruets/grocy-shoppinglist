name: Android

# - push / PR: quick checks (tsc + Jest)
# - vX.Y.Z tag: release APK build + GitHub Release with the APK
# - manual run: APK build as a workflow artifact, no release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  build-apk:
    name: Build APK
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # needed to create the release
    env:
      # arm64-v8a covers current Android phones; add x86_64 for an emulator.
      ARCHS: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Tag v1.2.3 → version 1.2.3; versionCode = run number (always increasing).
      - name: Version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            a.expo.version = process.argv[1];
            a.expo.android = { ...a.expo.android, versionCode: Number(process.argv[2]) };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
          ' "$VERSION" "$GITHUB_RUN_NUMBER"
          echo "Version $VERSION (versionCode $GITHUB_RUN_NUMBER)"

      # Generates android/ from app.json (Continuous Native Generation, folder not versioned).
      - run: npx expo prebuild --platform android --no-install --clean

      # Release signed with the Expo template debug key: installable APK, not for the Play Store.
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=$ARCHS

      - name: Name the APK
        run: |
          NAME="courses-grocy-${GITHUB_REF_NAME//\//-}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
