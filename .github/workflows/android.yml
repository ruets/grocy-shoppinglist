name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  build-apk:
    name: Build APK
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # arm64-v8a couvre les téléphones Android actuels ; ajouter x86_64 pour un émulateur.
      ARCHS: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Génère android/ depuis app.json (Continuous Native Generation, dossier non versionné).
      - run: npx expo prebuild --platform android --no-install --clean

      # Release signée avec la clé de debug du template Expo : APK installable, pas pour le Play Store.
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=$ARCHS

      - uses: actions/upload-artifact@v4
        with:
          name: courses-grocy-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
