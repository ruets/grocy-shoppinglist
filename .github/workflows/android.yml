name: Android

# - push / PR : vérifications rapides (tsc + Jest)
# - tag vX.Y.Z : build de l'APK release + Release GitHub avec l'APK
# - lancement manuel : build de l'APK en artefact, sans release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx jest --ci

  build-apk:
    name: Build APK
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # création de la release
    env:
      # arm64-v8a couvre les téléphones Android actuels ; ajouter x86_64 pour un émulateur.
      ARCHS: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - run: npm ci

      # Tag v1.2.3 → version 1.2.3 ; versionCode = numéro de run (toujours croissant).
      - name: Version depuis le tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node -e '
            const fs = require("fs");
            const a = JSON.parse(fs.readFileSync("app.json", "utf8"));
            a.expo.version = process.argv[1];
            a.expo.android = { ...a.expo.android, versionCode: Number(process.argv[2]) };
            fs.writeFileSync("app.json", JSON.stringify(a, null, 2));
          ' "$VERSION" "$GITHUB_RUN_NUMBER"
          echo "Version $VERSION (versionCode $GITHUB_RUN_NUMBER)"

      # Génère android/ depuis app.json (Continuous Native Generation, dossier non versionné).
      - run: npx expo prebuild --platform android --no-install --clean

      # Release signée avec la clé de debug du template Expo : APK installable, pas pour le Play Store.
      - name: Gradle assembleRelease
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=$ARCHS

      - name: Nommer l'APK
        run: |
          NAME="courses-grocy-${GITHUB_REF_NAME//\//-}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "APK=$NAME" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK }}
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Release GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
